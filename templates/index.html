<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist Store - Trang chủ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], } } } };
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

  <!-- ==========================================
       HEADER (Thanh điều hướng)
       ========================================== -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button class="p-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <button class="text-xl sm:text-2xl font-bold tracking-tight text-gray-900">
          Logo
        </button>
      </div>
      <div class="flex items-center space-x-2">
        <button class="p-2.5 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <i class="fa-regular fa-user text-lg"></i>
        </button>
        <!-- Nút Giỏ hàng -->
        <button id="cartToggleBtn" class="relative p-2.5 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <i class="fa-solid fa-cart-shopping text-lg"></i>
          <span id="cartBadge" class="absolute -top-0.5 -right-0.5 bg-gray-900 text-white text-[11px] font-semibold w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================
       MAIN CONTENT (Danh sách sản phẩm từ DB)
       ========================================== -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-baseline justify-between mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">Sản phẩm</h1>
    </div>

    <!-- KHU VỰC JINJA2 RENDER SẢN PHẨM -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for product in products %}
      <article class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-xs hover:shadow-md transition flex flex-col">
        <div class="aspect-[4/3] w-full overflow-hidden bg-gray-100">
          <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-full object-cover">
        </div>
        <div class="p-4 flex-1 flex flex-col justify-between">
          <div>
            <h2 class="text-base font-semibold text-gray-900 line-clamp-1">{{ product.name }}</h2>
            <p class="mt-1 text-sm font-medium text-gray-600">{{ "{:,.0f}".format(product.price) }} ₫</p>
          </div>
          <!-- Nút thêm vào giỏ mang theo thông tin ID, Tên, Giá -->
          <button
            type="button"
            data-add-id="{{ product.id }}"
            data-add-name="{{ product.name }}"
            data-add-price="{{ product.price }}"
            class="add-to-cart-btn mt-4 w-full py-2 px-3 bg-gray-100 hover:bg-gray-900 hover:text-white text-gray-800 text-xs font-medium rounded-lg transition flex items-center justify-center gap-1.5"
          >
            <i class="fa-solid fa-plus text-[11px]"></i>
            <span>Thêm vào giỏ</span>
          </button>
        </div>
      </article>
      {% endfor %}
    </div>
  </main>

  <!-- ==========================================
       CART DRAWER (Khay Giỏ hàng bên phải)
       ========================================== -->
  <div id="cartDrawer" class="fixed inset-0 z-40 hidden">
    <div id="cartBackdrop" class="fixed inset-0 bg-black/30 backdrop-blur-xs"></div>
    <aside class="fixed right-0 top-0 w-80 max-w-[85vw] bg-white h-full shadow-xl border-l border-gray-200 p-6 flex flex-col justify-between z-10">
      <div class="flex-1 flex flex-col min-h-0">
        <div class="flex items-center justify-between pb-4 border-b border-gray-100">
          <span class="text-lg font-bold text-gray-900">Giỏ hàng</span>
          <button id="closeCartBtn" class="p-2 text-gray-500 hover:text-gray-900">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="cartItemsList" class="flex-1 overflow-y-auto py-4 space-y-3"></div>
      </div>
      <div class="pt-4 border-t border-gray-200">
        <div class="flex items-center justify-between text-sm font-semibold text-gray-900 mb-4">
          <span>Tổng cộng:</span>
          <span id="cartTotalPrice">0 ₫</span>
        </div>
        <button id="checkoutBtn" type="button" class="w-full py-2.5 bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium rounded-lg transition">
          Thanh toán
        </button>
      </div>
    </aside>
  </div>

  <!-- TOAST THÔNG BÁO -->
  <div id="toastNotification" class="fixed bottom-5 right-5 z-50 hidden bg-gray-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-lg shadow-lg flex items-center space-x-2">
    <i class="fa-solid fa-circle-check text-gray-300"></i>
    <span id="toastMessage">Đã thêm vào giỏ hàng</span>
  </div>

  <!-- ==========================================
       JAVASCRIPT XỬ LÝ GIỎ HÀNG & API
       ========================================== -->
  <script>
    const cart = {};

    function formatCurrency(amount) {
      return amount.toLocaleString('vi-VN') + ' ₫';
    }

    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('hidden'), 2200);
    }

    function renderCart() {
      const badge = document.getElementById('cartBadge');
      const list = document.getElementById('cartItemsList');
      const totalEl = document.getElementById('cartTotalPrice');

      const entries = Object.values(cart);
      const totalCount = entries.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = entries.reduce((sum, item) => sum + item.qty * item.product.price, 0);

      badge.textContent = totalCount;
      totalEl.textContent = formatCurrency(totalPrice);

      if (entries.length === 0) {
        list.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">Giỏ hàng đang trống.</div>`;
        return;
      }

      list.innerHTML = entries.map(({ product, qty }) => `
        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-200">
          <div class="pr-2">
            <p class="text-xs font-semibold text-gray-900">${product.name}</p>
            <p class="text-xs text-gray-500">${formatCurrency(product.price)} x ${qty}</p>
          </div>
          <button type="button" data-remove-id="${product.id}" class="remove-cart-item-btn text-gray-400 hover:text-gray-800 p-1.5">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCart();

      // Bấm nút: Thêm vào giỏ
      document.getElementById('productGrid').addEventListener('click', (e) => {
        const btn = e.target.closest('.add-to-cart-btn');
        if (!btn) return;
        const id = Number(btn.getAttribute('data-add-id'));
        const name = btn.getAttribute('data-add-name');
        const price = Number(btn.getAttribute('data-add-price'));
        
        if (!cart[id]) {
          cart[id] = { product: { id, name, price }, qty: 0 };
        }
        cart[id].qty += 1;
        renderCart();
        showToast(`Đã thêm "${name}" vào giỏ`);
      });

      // Bấm nút: Xóa khỏi giỏ
      document.getElementById('cartItemsList').addEventListener('click', (e) => {
        const btn = e.target.closest('.remove-cart-item-btn');
        if (!btn) return;
        delete cart[Number(btn.getAttribute('data-remove-id'))];
        renderCart();
      });

      // Đóng/mở Menu Giỏ hàng
      const cartDrawer = document.getElementById('cartDrawer');
      document.getElementById('cartToggleBtn').addEventListener('click', () => cartDrawer.classList.remove('hidden'));
      document.getElementById('closeCartBtn').addEventListener('click', () => cartDrawer.classList.add('hidden'));
      document.getElementById('cartBackdrop').addEventListener('click', () => cartDrawer.classList.add('hidden'));

      // NÚT THANH TOÁN: Gọi API Python lưu vào Database
      document.getElementById('checkoutBtn').addEventListener('click', async () => {
        const entries = Object.values(cart);
        if (entries.length === 0) {
          showToast('Giỏ hàng đang trống!');
          return;
        }

        const name = prompt("Vui lòng nhập Tên của bạn:");
        if (!name) return;
        const phone = prompt("Vui lòng nhập Số điện thoại:");
        if (!phone) return;

        // Chuẩn bị dữ liệu gửi đi
        const orderData = {
          customer_name: name,
          customer_phone: phone,
          items: entries.map(e => ({
            product_id: e.product.id,
            quantity: e.qty,
            price: e.product.price
          }))
        };

        try {
          const response = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
          });
          
          const result = await response.json();
          if (result.status === "success") {
            // Xóa rỗng giỏ hàng sau khi đặt thành công
            Object.keys(cart).forEach(k => delete cart[k]);
            renderCart();
            cartDrawer.classList.add('hidden');
            showToast('Đơn hàng đã được gửi thành công!');
          }
        } catch (error) {
          showToast('Có lỗi xảy ra, vui lòng thử lại.');
        }
      });
    });
  </script>
</body>
</html>
